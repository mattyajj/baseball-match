<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ベースボール・マッチ</title>
<style>
:root{--bg:#0b1d12;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d12}}
:root[data-theme="dark"]{--bg:#0b1d12}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
</style></head><body><canvas id="c" width="1000" height="700"></canvas>
<script>
'use strict';
const W=1000,H=700,PI=Math.PI,c=document.getElementById('c'),g=c.getContext('2d'),FN='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
const rnd=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),gs=()=>(rnd()+rnd()+rnd()-1.5)*2;
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight*.98/H);c.style.width=W*s+'px';c.style.height=H*s+'px'};
addEventListener('resize',fit);fit();
/* ===== データ層: 選手能力・球種・難易度 =====
 選手: mk(名前,{pow,con,spd,ctl,mov,vel,sk:['固有能力名'],ps:[球種ID]})
 固有能力は SK に登録: SK['名']={bat:(x,p)=>{x.v*=1.05}, pit:(x,p)=>{x.mv*=1.2}}
 bat: x={q,v,la,sa}(打球の質/初速/角度) / pit: x={sp,mv}(球速/変化量) */
const mk=(n,o)=>({n,pow:50,con:50,spd:50,ctl:50,mov:50,vel:145,sk:[],ps:[0,1,2,3,4],...o});
const SK={},hook=(e,x,p)=>p.sk.forEach(s=>SK[s]&&SK[s][e]&&SK[s][e](x,p));
const N1=['山田','鈴木','佐藤','高橋','田中','伊藤','渡辺','小林','加藤'],N2=['青木','石井','井上','岡田','木村','近藤','斎藤','清水','中村'];
const lin=N=>N.map((n,i)=>mk(n,{pow:44+i%4*8,con:48+i%3*6,spd:44+i*3}));
const TM=[{s:'ジャ',col:'#e8710a',fld:50,lin:lin(N1),pit:mk('エース',{vel:148,ctl:55,mov:55})},{s:'ブル',col:'#1f5fd6',fld:50,lin:lin(N2),pit:mk('抑え',{vel:146,ctl:52,mov:50})}];
const PCOL=['#70d7ff','#ff77d7','#ffd35a','#88f08d','#b997ff'];
const PT=[{n:'ストレート',d:0,bx:0,by:-.12,sr:34,sa:-1.57},{n:'スライダー',d:-17,bx:-.8,by:.3,sr:30,sa:.4},{n:'カーブ',d:-36,bx:-.35,by:1.05,sr:22,sa:1.57},{n:'フォーク',d:-13,bx:0,by:1.1,sr:5,sa:-1.57},{n:'チェンジアップ',d:-22,bx:.35,by:.45,sr:16,sa:-1.3}];
const DF=[{n:'かんたん',w:.19,R:30,cs:.34,us:.1,sw:.68,ch:.36,pc:.62},{n:'ふつう',w:.14,R:24,cs:.24,us:.17,sw:.76,ch:.28,pc:.72},{n:'むずかしい',w:.1,R:19,cs:.15,us:.26,sw:.85,ch:.2,pc:.8}];
const ZC=[500,387],ZW=140,ZH=196,Z=(u,v)=>[ZC[0]+u*ZW/2,ZC[1]+v*ZH/2];
const FP=[[0,18],[0,-2],[24,24],[11,38],[-11,38],[-24,24],[-48,68],[0,84],[48,68]],BS=[[19.4,19.4],[0,38.8],[-19.4,19.4]],RP=[[0,0],...BS,[0,0]],FL='投捕一二遊三左中右';
const X=x=>500+x*5.4,Y=y=>640-y*5.4;
// 外野フェンス距離。両翼96m、左中間・右中間110m、センター122m。
const FENCE_A=[[-PI/4,96],[-PI/6,104],[-PI/12,116],[0,122],[PI/12,116],[PI/6,104],[PI/4,96]],FENCE_P=FENCE_A.map(v=>[Math.sin(v[0])*v[1],Math.cos(v[0])*v[1]]);
// ホームから伸ばしたレイと、画面に描くフェンス線分そのものの交点距離。
function fenceDist(a){const dx=Math.sin(a),dy=Math.cos(a);for(let i=0;i<FENCE_P.length-1;i++){const A=FENCE_P[i],B=FENCE_P[i+1],sx=B[0]-A[0],sy=B[1]-A[1],den=dx*sy-dy*sx;if(Math.abs(den)<1e-8)continue;const t=(A[0]*sy-A[1]*sx)/den,u=(A[0]*dy-A[1]*dx)/den;if(t>=0&&u>=0&&u<=1)return t}return 1e9}
// 1フレームのボール移動線と、フェンス線分の厳密な交点。
function fenceHit(px,py,x,y){const rx=x-px,ry=y-py;for(let i=0;i<FENCE_P.length-1;i++){const A=FENCE_P[i],B=FENCE_P[i+1],sx=B[0]-A[0],sy=B[1]-A[1],den=rx*sy-ry*sx;if(Math.abs(den)<1e-8)continue;const qx=A[0]-px,qy=A[1]-py,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;if(t>=0&&t<=1&&u>=0&&u<=1)return {x:px+rx*t,y:py+ry*t,sx,sy}}return null}
let G={ph:'menu'},D=DF[1];
const tot=t=>G.sc[t].reduce((a,b)=>a+b,0),later=(s,f)=>{G.tm=s;G.nx=f},say=(t,s)=>{G.msg=t;G.mt=s||1};
const SP=()=>6.5+(TM[1-G.bt].fld-50)*.02,inr=(x,y,a,b,w,h)=>x>=a&&x<=a+w&&y>=b&&y<=b+h;
const addRuns=n=>{G.sc[G.bt][G.inn-1]+=n},endPA=()=>{G.B=G.S=0;G.idx[G.bt]++};
const fin=(r,run)=>{const lp=r.P&&r.P[r.P.length-1];if(lp&&r.sa==null)r.sa=Math.atan2(lp.x,Math.max(.01,lp.y));if(lp&&r.la==null)r.la=Math.atan2(Math.max(0,...r.P.map(p=>p.z))-.9,Math.max(1,Math.hypot(lp.x,lp.y)));r.run=run;r.rs=Math.max(8,run/Math.max(1,r.te-.6));return r};

/* ===== ルール: 走者進塁 ===== */
function adv(n,ex){const nb=[0,0,0];let r=0;for(let i=2;i>=0;i--)if(G.b[i]){const d=i+1+n+ex;if(d>=4)r++;else nb[d-1]=1}if(n>=4)r++;else nb[n-1]=1;G.b=nb;return r}
function grd(bs,rm,sd){const B=G.b,nb=[0,0,0];let r=0;for(let i=2;i>=0;i--)if(B[i]){if(i===0&&rm)continue;const fo=i===0||(i===1&&B[0])||(i===2&&B[0]&&B[1]),d=i+1+((fo||(sd&&G.outs<2))?1:0);if(d>=4)r++;else nb[d-1]=1}if(bs)nb[0]=1;G.b=nb;return r}
function walk(){const B=G.b;let r=0;if(B[0]){if(B[1]){if(B[2])r=1;B[2]=1}B[1]=1}B[0]=1;return r}

/* ===== 打球シミュレーション+守備判定 ===== */
function play(v,la,sa){
 const P=[],dt=1/60,SPD=SP(),centerFixed=false;let x=0,y=0,z=.9,t=0,h=v*Math.cos(la),vz=v*Math.sin(la),vx=h*Math.sin(sa),vy=h*Math.cos(sa),hr=false,wall=false,wallT=-1;
 if(centerFixed){const outT=3.55,backT=1.25,fd=122;for(let i=0;i<=Math.round((outT+backT)*60);i++){t=i/60;if(t<=outT){const q=t/outT;x=Math.sin(sa)*fd*q*.35;y=fd*q;z=.9+5.4*Math.sin(PI*q)}else{const q=(t-outT)/backT;x=Math.sin(sa)*fd*.35*(1-q*.15);y=fd-14*q;z=Math.max(0,2.0*(1-q))}P.push({x,y,z,t,wall:Math.abs(t-outT)<.012?1:0})}wall=true;wallT=outT;x=P[P.length-1].x;y=P[P.length-1].y;z=0;t=P[P.length-1].t}else for(let i=0;i<1200;i++){
  P.push({x,y,z,t});
  const px=x,py=y,pz=z;x+=vx*dt;y+=vy*dt;vz-=9.8*dt;z+=vz*dt;t+=dt;
  const hit=!wall?fenceHit(px,py,x,y):null;
  if(hit){const q=cl(Math.hypot(hit.x-px,hit.y-py)/Math.max(.0001,Math.hypot(x-px,y-py)),0,1),hz=pz+(z-pz)*q;if(hz>3.5){x=hit.x;y=hit.y;z=hz;hr=true;P.push({x,y,z,t});break}else{const tl=Math.hypot(hit.sx,hit.sy),nx=hit.sy/tl,ny=-hit.sx/tl,dot=vx*nx+vy*ny;x=hit.x-nx*.85;y=hit.y-ny*.85;z=hz;vx-=1.68*dot*nx;vy-=1.68*dot*ny;vx*=.78;vy*=.78;vz*=.72;wall=true;wallT=t;P.push({x,y,z:Math.max(z,0),t,wall:1})}}

  if(z<=0){z=0;if(vz<-2.5){vz=-vz*.4;vx*=.75;vy*=.75}else vz=0}
  if(z===0&&vz===0){const k=Math.exp(-.55*dt);vx*=k;vy*=k;if(Math.hypot(vx,vy)<.5){P.push({x,y,z,t});break}}
 }
 const L=P[P.length-1],fair=Math.abs(sa)<=PI/4;
 if(hr)return fin({P,kind:'HR',te:L.t+2.8,wall:1,wallT:t},109.6);
 let iL=P.findIndex((p,i)=>i>0&&p.z<=0);if(iL<0)iL=P.length-1;const land0=P[iL],hitDepth=Math.hypot(land0.x,land0.y),hitAngle=Math.atan2(land0.x,Math.max(.01,land0.y));
 let best=null;
 FP.forEach((f,k)=>{for(let i=0;i<P.length;i++){const p=P[i];if(p.z>2.6)continue;if(.3+Math.max(0,Math.hypot(p.x-f[0],p.y-f[1])-1.2)/SPD<=p.t){if(!best||p.t<best.t)best={k,i,t:p.t};break}}});
 if(!best){let m=1e9;FP.forEach((f,k)=>{const tt=.3+Math.max(0,Math.hypot(L.x-f[0],L.y-f[1])-1.2)/SPD;if(tt<m){m=tt;best={k,i:P.length-1,t:Math.max(tt,L.t)}}})}
 const q=P[best.i],caught=best.i<iL,dep=Math.hypot(q.x,q.y);
 if(!fair){if(caught)return fin({P,kind:'FO',k:best.k,best,dep,foul:1,te:best.t+.9},0);return fin({P,kind:'FOUL',te:Math.min(L.t,4)+.5},0)}
 if(caught){const r={P,kind:'FO',k:best.k,best,dep,te:best.t+.9,sa,la};
  if(G.outs<2&&G.b[2]&&dep>48){const arm=31+(TM[1-G.bt].fld-50)*.08,throwD=Math.hypot(q.x,q.y),throwT=.42+throwD/arm,runnerT=3.05-G.cur.spd*.006;r.sac=1;r.tt=best.t+.42;r.thr=[0,0];r.td=throwT;r.throwLabel='バックホーム';r.crossT=r.tt+throwT;r.sacSafe=runnerT<=throwT+.18;r.te=r.crossT+1.25}return fin(r,0)};
 const d1=Math.hypot(q.x-BS[0][0],q.y-BS[0][1]),d2=Math.hypot(q.x-BS[1][0],q.y-BS[1][1]),tf=best.t,T1=4.6-G.cur.spd*.006,t1=tf+.6+d1/30,t2=tf+.6+d2/30;
 const r={P,k:best.k,best,dep,tt:tf+.6,sa,la,land:L,land0,hitDepth,hitAngle,wall,wallT};
 if(G.b[0]&&G.outs<2&&t2<3.5){r.kind=t2+1.6<T1?'DP':'FC';r.thr=BS[1];r.throwLabel='二塁へ送球';r.td=Math.max(.1,d2/30)}
 else if(t1<T1){r.kind='GO';r.thr=BS[0];r.throwLabel='一塁へ送球';r.td=Math.max(.1,d1/30)}
 else{r.kind='H';const localFence=fenceDist(hitAngle),deepRatio=hitDepth/localFence,gap=Math.abs(hitAngle)>.24&&Math.abs(hitAngle)<.66;r.n=Math.abs(hitAngle)<.18?1:(wall?(gap?3:2):((gap&&hitDepth>=88&&deepRatio>=.82)?3:((hitDepth>=78&&deepRatio>=.74)?2:1)));r.ex=(r.n===1&&best.k>=6&&hitDepth>=62&&Math.abs(hitAngle)>=.18)?1:0;if(r.n===1){r.thr=BS[1];r.throwLabel='二塁へ返球'}else if(r.n===2){r.thr=BS[2];r.throwLabel='三塁へ返球'}else{r.thr=[0,0];r.throwLabel='バックホーム'}r.td=Math.max(.1,Math.hypot(q.x-r.thr[0],q.y-r.thr[1])/30)}
 r.te=r.tt+r.td+.8;
 return fin(r,r.kind==='H'?r.n*27.4:27.4)}

/* ===== 進行 ===== */
function newGame(d){D=DF[d];G={ph:'wait',v:'b',inn:1,top:1,bt:0,outs:0,b:[0,0,0],B:0,S:0,sc:[[0,0,0],[0,0,0]],idx:[0,0],cx:ZC[0],cy:ZC[1],msg:'',mt:0,tm:0,nx:null,sel:-1,tg:null,info:'',sa:0,sw:0,cur:TM[0].lin[0],pt:TM[1].pit};say('1回表 プレイボール',1.6);later(1.9,nextPitch)}
function nextPitch(){const t=G.top?0:1;Object.assign(G,{bt:t,cur:TM[t].lin[G.idx[t]%9],pt:TM[1-t].pit,cx:ZC[0],cy:ZC[1],bl:null,sw:0,sa:0,ts:null,hf:0,sr:null,hold:0,drag:0,info:'',v:'b',sel:-1,tg:null});if(G.top)cpuThrow();else G.ph='psel'}
function setBall(k,u,v,p){const x={sp:Math.round(p.vel+PT[k].d+rnd()*4-2),mv:.8+p.mov/250};hook('pit',x,p);G.bl={k,u,v,sp:x.sp,T:130/x.sp,t:0,mv:x.mv}}
function cpuThrow(){const p=G.pt,k=p.ps[(rnd()*p.ps.length)|0];let u,v;
 if(rnd()<(G.B>=3?.92:G.S>=2?.4:.62)){u=(rnd()*2-1)*.85;v=(rnd()*2-1)*.85}
 else if(rnd()<.5){u=(rnd()<.5?-1:1)*(1.15+rnd()*.4);v=(rnd()*2-1)*1.3}
 else{v=(rnd()<.5?-1:1)*(1.15+rnd()*.4);u=(rnd()*2-1)*1.3}
 const sg=D.cs*(1.5-p.ctl/100);setBall(k,u+gs()*sg,v+gs()*sg,p);G.wl=.8;G.wt=0;G.ph='wind'}
function throwIt(){if(G.sel<0||!G.tg||G.ph!=='psel')return;const p=G.pt,sg=D.us*(1.5-p.ctl/100);setBall(G.sel,G.tg.u+gs()*sg,G.tg.v+gs()*sg,p);const o=cpuBat();G.sr=o;G.sw=o.k!=='take'?1:0;G.wl=.35;G.wt=0;G.ph='wind'}
function swing(){const b=G.bl,dt=b.t+.1-b.T,f=Z(b.u,b.v),dx=G.cx-f[0],dy=G.cy-f[1],d=Math.hypot(dx,dy),w=D.w*1.25;G.sw=1;G.ts=0;
 if(Math.abs(dt)>w||d>D.R*1.7){G.sr={k:'miss'};return}
 const q=cl(1-.55*Math.abs(dt)/w-.45*d/(D.R*1.7),0,1);
 if(q<.2){G.sr={k:'foul'};return}
 const p=G.cur,x={q,v:(16+24*q)*(.9+p.pow/500),la:cl(12+dy/D.R*22,-25,60),sa:cl(-dt/w*60-dx/D.R*20+gs()*9+(rnd()-.5)*10,-44,44)};
 hook('bat',x,p);G.sr={k:'hit',pl:play(x.v,x.la*PI/180,x.sa*PI/180)}}
function cpuBat(){const b=G.bl,zn=Math.abs(b.u)<=1&&Math.abs(b.v)<=1,nr=Math.abs(b.u)<=1.5&&Math.abs(b.v)<=1.5,p=G.cur;
 let ps=zn?D.sw:nr?D.ch:.04;if(G.S===2&&zn)ps=.94;if(G.B===3&&!zn)ps=.02;
 if(rnd()>=ps)return{k:'take'};
 const dist=Math.hypot(b.u,b.v),pc=cl(D.pc*Math.sqrt(p.con/50)-[0,.06,.08,.14,.07][b.k]-(dist>1.1?.28:dist*.1),.05,.95);
 if(rnd()>=pc)return{k:'miss'};
 const x={q:cl(.12+.88*Math.pow(rnd(),1.1),0,1)};
 if(x.q<.18)return{k:'foul'};
 x.v=(16+24*x.q)*(.9+p.pow/500);x.la=cl(10+gs()*15+b.v*6,-25,60);x.sa=cl(gs()*42+(rnd()-.5)*22,-44,44);
 hook('bat',x,p);return{k:'hit',pl:play(x.v,x.la*PI/180,x.sa*PI/180)}}
function settle(o){const b=G.bl,zn=Math.abs(b.u)<=1&&Math.abs(b.v)<=1;G.info=b.sp+'km/h '+PT[b.k].n;
 if(o.k==='take'){if(zn)strike();else ball();return}
 if(o.k==='miss'){strike();return}
 if(o.k==='foul'){if(G.S<2)G.S++;say('ファウル',1);later(1.2,nextPitch);return}
 G.pl=o.pl;G.v='f';G.ft=0;G.ph='field'}
function strike(){if(++G.S>=3){G.outs++;endPA();say('三振',1.3);later(1.5,afterPlay)}else{say('ストライク',.9);later(1.1,nextPitch)}}
function ball(){if(++G.B>=4){addRuns(walk());endPA();say('フォアボール',1.3);later(1.5,afterPlay)}else{say('ボール',.9);later(1.1,nextPitch)}}
function done(){const r=G.pl;let runs=0,o=0,m='';
 if(r.kind==='FOUL'){if(G.S<2)G.S++;say('ファウル',1);later(1.2,nextPitch);return}
 switch(r.kind){
  case 'HR':runs=adv(4,0);m=runs>=4?'満塁ホームラン!!':'ホームラン!!';break;
  case 'H':runs=adv(r.n,r.ex);{const deg=(r.hitAngle!=null?r.hitAngle:r.sa)*180/PI,depth=r.hitDepth||0,side=deg>13?'ライト':deg<-13?'レフト':'センター',shape=r.la<.08?'ゴロ':r.la>.38?'フライ':'ライナー';if(r.n===1)m=Math.abs(deg)<=13?'センター前ヒット':side+(Math.abs(deg)>31?'線':'前')+'ヒット';else if(r.n===2)m=r.wall?side+'フェンス直撃ツーベース':(Math.abs(deg)>29?side+'線ツーベース':side+'オーバーのツーベース');else m=r.wall?side+'フェンス直撃スリーベース':side+'オーバーのスリーベース';G.info=shape+' / '+m+' 着地'+Math.round(depth)+'m / フェンス'+Math.round(fenceDist(r.hitAngle!=null?r.hitAngle:r.sa))+'m'}break;
  case 'FO':o=1;if(r.sac){G.b[2]=0;if(r.sacSafe){runs=1;m='犠牲フライ　ホームイン'}else{o++;m='バックホームでタッチアウト'}}else if(!r.foul&&G.outs<2){if(r.dep>82&&G.b[1]&&!G.b[2]){G.b[1]=0;G.b[2]=1}}else m=r.foul?'ファウルフライ':'フライアウト';if(!m)m=r.foul?'ファウルフライ':'フライアウト';break;
  case 'GO':o=1;runs=grd(0,0,r.k===2||r.k===3);m='ゴロアウト';break;
  case 'DP':o=2;runs=grd(0,1,0);m='ダブルプレー';break;
  case 'FC':o=1;runs=grd(1,1,0);m='フィルダースチョイス';break}
 G.outs+=o;if(G.outs>=3)runs=0;
 if(runs)addRuns(runs);
 endPA();say(m+(runs?' '+runs+'点':''),1.5);later(1.7,afterPlay)}
function afterPlay(){if(!G.top&&G.inn>=2&&tot(1)>tot(0))return over();if(G.outs>=3)return endHalf();nextPitch()}
function over(){G.ph='over'}
function endHalf(){G.outs=0;G.b=[0,0,0];G.B=G.S=0;
 if(G.top){if(G.inn>=2&&tot(1)>tot(0))return over();G.top=0}
 else{if(G.inn>=2&&(tot(0)!==tot(1)||G.inn>=3))return over();G.inn++;G.top=1}
 if(G.inn>=3)G.b=[1,1,0];
 say((G.inn>=3?'延長タイブレーク ':G.inn+'回')+(G.top?'表':'裏')+(G.inn>=3?' 無死一・二塁':''),1.7);G.ph='wait';later(1.9,nextPitch)}

/* ===== 入力 ===== */
const setTg=(x,y)=>{G.tg={u:cl((x-ZC[0])/(ZW/2),-1.7,1.7),v:cl((y-ZC[1])/(ZH/2),-1.7,1.7)}};
const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
function down(x,y){
 if(G.ph==='menu'){DF.forEach((d,i)=>{if(inr(x,y,340,330+i*84,320,68))newGame(i)});return}
 if(G.ph==='over'){if(inr(x,y,380,540,240,64))G={ph:'menu'};return}
